<main id="app"></main>
<script>
const A=[['Photography Coverage',8000],['Videography Coverage',12000],['Event Coordination',18000],['Premium Photo Album',3500],['Drone Coverage Add-on',5000]];
const P=[
{n:'Lumière Studios',t:'Photo + Video',r:4.9,rv:128,f:1,tr:1500,g:['#e8a58b','#b55a3f'],ver:1,busy:[4,5,11,12,18,25],pub:1},
{n:'Kalayaan Events Co.',t:'Event Organizer',r:4.7,rv:86,f:1.15,tr:2000,g:['#d9b97a','#8a6a2c'],ver:1,busy:[7,14,15,21,28],pub:1},
{n:'Bloom & Frame',t:'Studio',r:4.8,rv:64,f:.9,tr:1000,g:['#c9a09a','#6d3b3a'],ver:1,busy:[1,8,14,22,29],pub:1},
{n:'Sunrise Films',t:'Videographer',r:4.6,rv:41,f:.95,tr:1800,g:['#e3b58f','#7a4a2c'],ver:0,busy:[2,9,16,23,30],pub:1}];
const S={role:'c',v:'home',ev:'Wedding',date:'2026-11-14',loc:'Davao City',bud:100000,pid:0,sel:[0],cmp:[],saved:[1],q:[],b:[],msgs:[{p:0,f:'p',t:'Hi Maria! Thanks for checking our calendar. Happy to tailor a package for your date.'}],pv:0,mp:0,auth:null,menu:0,lr:'c',reg:0,cn:'Maria Santos',rep:[{id:1,t:'Listing "Sunrise Films" – misleading portfolio claim',open:1},{id:2,t:'Review flagged as spam (Bloom & Frame)',open:1}],pt:'Dashboard',at:'Dashboard',ct:'Dashboard'};
const $=n=>'₱'+Math.round(n).toLocaleString();
const pr=(p,i)=>P[p].sv&&P[p].sv[i]?P[p].sv[i][1]:0;
const tot=(p,s)=>s.reduce((a,i)=>a+pr(p,i),0);
const av=(p,d)=>!P[p].bd.includes(d);
const start=p=>pr(p,0);
function go(v,x){S.v=v;if(x!==undefined)S.pid=x;render();scrollTo(0,0)}
function set(k,v){S[k]=v;render()}
function tog(i){S.sel=S.sel.includes(i)?S.sel.filter(x=>x!=i):[...S.sel,i];render()}
function cmp(p){S.cmp=S.cmp.includes(p)?S.cmp.filter(x=>x!=p):[...S.cmp.slice(-1),p];render()}
function sv(p){S.saved=S.saved.includes(p)?S.saved.filter(x=>x!=p):[...S.saved,p];render()}
function reqQ(p,sel){S.q.push({id:S.q.length+1,p,sel:[...sel],t:tot(p,sel),tr:P[p].tr,st:'Pending',ev:S.ev,d:S.date});S.v='quote';render()}
function qs(id,st){S.q.find(x=>x.id==id).st=st;render()}
function book(id){const q=S.q.find(x=>x.id==id);q.st='Booked';S.b.push({id:S.b.length+1,q:id,p:q.p,st:'Awaiting deposit',dep:Math.round((q.t+q.tr)*.3),t:q.t+q.tr,d:q.d,ev:q.ev});S.v='workspace';render()}
function bs(id,st){S.b.find(x=>x.id==id).st=st;render()}
function ph(p,l,c){return `<div class="ph ${c||''}" style="background:linear-gradient(135deg,${P[p].g[0]},${P[p].g[1]})">${l||''}</div>`}
function cal(p,e){const d=S.date,dim=30,h='SMTWTFS'.split('').map(x=>`<div class="h">${x}</div>`).join('');let c='';for(let i=1;i<=dim;i++)c+=`<div class="${P[p].busy.includes(i)?'b':''} ${i==+d.slice(8)?'sel':''}"${e?' onclick="tb('+p+','+i+')" style="cursor:pointer"':''}>${i}</div>`;return `<div class="cal">${h}${c}</div><p class="note">Updated by provider on Sep 28, 2026. Struck-through dates are booked. Availability is provider-maintained and not guaranteed until a booking is confirmed.</p>`}
function card(i){const p=P[i],a=av(i,S.date);return `<div class="card">${ph(i,'Portfolio preview')}<div class="pad"><div class="fl"><h3>${p.n}</h3><span onclick="sv(${i})" style="cursor:pointer;color:var(--ac)">${S.saved.includes(i)?'♥':'♡'}</span></div><div class="mu">${p.t} · ${p.c||S.loc} · ★ ${p.r} (${p.rv})</div><div style="margin:6px 0"><span class="tag ${a?'ok':'no'}">${a?'Available '+S.date:'Booked '+S.date}</span>${p.ver?'<span class="tag g">Verified*</span>':''}${p.solo?'<span class="tag">Solo · budget-friendly</span>':''}${subOn(i)?'<span class="tag ok">✓ Verified member</span>':''}</div><div class="fl"><div><span class="mu">Starts at</span><br><b>${$(start(i))}</b></div><div><button class="btn o s" onclick="cmp(${i})">${S.cmp.includes(i)?'✓ Comparing':'Compare'}</button> <button class="btn s" onclick="go('profile',${i})">View Profile</button></div></div></div></div>`}
const tabs=()=>'';
